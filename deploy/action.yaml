name: 'Publish API'
description: 'Publish API to IBM API Connect'
inputs:
  manager-host:
    description: 'API Manager hostname'
    required: true
  api-host:
    description: 'Platform API hostname'
    required: true
  client-id:
    description: 'Toolkit client ID from credentials.json'
    required: true
  client-secret:
    description: 'Toolkit client secret from credentials.json'
    required: true
  apikey:
    description: 'APIC platform API key (grant_type=api_key). Use this or username+password+realm.'
    required: false
  username:
    description: 'API Manager username'
    required: false
  password:
    description: 'API Manager password'
    required: false
  realm:
    description: 'Realm for log in'
    default: "provider/default-idp-2"
    required: false
  provider-org:
    description: 'Name or ID of provider org to publish to'
    required: true
  catalog:
    description: 'Name or ID of catalog to publish to'
    required: true
  project:
    description: 'Name of project to build'
    required: true
    default: 'project'
  project-path:
    description: 'Path to project to build'
    required: true
    default: '.'
branding:
  icon: 'upload-cloud'
  color: 'blue'
runs:
  using: "composite"
  steps:

  - name: Get bearer token
    shell: bash
    run: |
      API=https://${{ inputs.api-host }}/api
      if [[ "${{ inputs.apikey }}" != "" ]]; then
        echo "Using API key grant"
        TOKEN=$(curl -s -X POST $API/token \
          -H 'Content-Type: application/json' -H 'Accept: application/json' \
          -d '{
            "api_key": "'"${{ inputs.apikey }}"'",
            "client_id": "'"${{ inputs.client-id }}"'",
            "client_secret": "'"${{ inputs.client-secret }}"'",
            "grant_type": "api_key"
          }' | jq -r .access_token)
      else
        echo "Using password grant"
        TOKEN=$(curl -s -X POST $API/token \
          -H 'Content-Type: application/json' -H 'Accept: application/json' \
          -d '{
            "username": "'"${{ inputs.username }}"'",
            "password": "'"${{ inputs.password }}"'",
            "realm": "'"${{ inputs.realm }}"'",
            "client_id": "'"${{ inputs.client-id }}"'",
            "client_secret": "'"${{ inputs.client-secret }}"'",
            "grant_type": "password"
          }' | jq -r .access_token)
      fi
      echo "APIC_TOKEN=${TOKEN}" >> $GITHUB_ENV

  - name: Build deployment for project
    shell: bash
    run: |
      (cd "${{ inputs.project-path }}" && find . -type f \( -name '*.yml' -o -name '*.yaml' -o -name '*.json' \) | zip "${GITHUB_WORKSPACE}/built-project.zip" -@)

  - name: Publish project via REST
    shell: bash
    run: |
      API=https://${{ inputs.api-host }}/api
      RESULT=$(curl -s -w '\n%{http_code}' -X POST \
        $API/catalogs/${{ inputs.provider-org }}/${{ inputs.catalog }}/publish-project \
        -H "Authorization: Bearer ${APIC_TOKEN}" \
        -H 'Accept: application/json' \
        -F "project=@built-project.zip;type=application/zip")
      HTTP_STATUS=$(echo "$RESULT" | tail -1)
      BODY=$(echo "$RESULT" | head -n -1)
      echo "$BODY"
      if [[ "$HTTP_STATUS" -ge 400 ]]; then
        echo "Publish failed with status $HTTP_STATUS"
        exit 1
      fi

  - name: Sign out
    shell: bash
    if: always()
    run: |
      curl -s -X POST https://${{ inputs.api-host }}/api/me/sign-out \
        -H "Authorization: Bearer ${APIC_TOKEN}" \
        -H 'Accept: application/json' || true
